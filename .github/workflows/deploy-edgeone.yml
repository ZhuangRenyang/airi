name: Deploy to EdgeOne

on:
  # EdgeOne's Git integration builds and deploys on push to main.
  # This workflow is a manual fallback (bypasses EdgeOne's build env).
  workflow_dispatch:

concurrency:
  group: deploy-edgeone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # Keep the same runtime as CI (Node 26.7.0, Vite 8 requires >= 22.12,
      # which exceeds the max Node version available in EdgeOne's build env).
      - uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:web

      - name: Deploy to EdgeOne Pages
        # Skip gracefully (keep the workflow green) until the user adds the
        # EDGEONE_API_TOKEN repository secret.
        if: ${{ env.EDGEONE_API_TOKEN != '' }}
        run: npx edgeone pages deploy apps/stage-web/dist --name airi --token "$EDGEONE_API_TOKEN"
