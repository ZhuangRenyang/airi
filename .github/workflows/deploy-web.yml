name: Deploy Web to gh-pages

# Builds the web bundle on GitHub's runners (16 GB, plenty for this
# monorepo — EdgeOne's free builder OOM-kills vite build) and pushes the
# dist/ output to the gh-pages branch, which EdgeOne Pages serves directly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (web subset)
        run: pnpm install --filter @proj-airi/stage-web... --frozen-lockfile

      - name: Build web bundle
        run: pnpm run build:web

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/stage-web/dist
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github'
