name: Deploy to EdgeOne

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-edgeone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # Building here instead of in EdgeOne's builder: its container runs out of
      # memory/disk on this monorepo (the whole server stack is pulled in through
      # stage-ui's devDependency on api-server, then vite bundles three.js/live2d).
      # Same runtime as CI.
      - uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:web

      - name: Deploy to EdgeOne Pages
        # Skip gracefully (keep the workflow green) until the user adds the
        # EDGEONE_API_TOKEN repository secret.
        if: ${{ env.EDGEONE_API_TOKEN != '' }}
        # --area overseas = 全球可用区(不含中国大陆): the default "global"
        # includes the mainland, which then requires ICP filing to bind any
        # custom domain. overseas accepts the unfiled domain and still serves
        # mainland visitors through overseas nodes.
        run: npx edgeone pages deploy apps/stage-web/dist --name airi-web --area overseas --token "$EDGEONE_API_TOKEN"
